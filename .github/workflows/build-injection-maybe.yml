name: Build and Push injection_maybe Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'web_injection_maybe_5000/**'
      - '.github/workflows/build-injection-maybe.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker 镜像 Tag (默认为 web_injection_maybe_5000_fix_v1)'
        required: false
        default: 'web_injection_maybe_5000_fix_v1'

env:
  REGISTRY: crpi-w9yhsqxiwfigz16b.cn-hangzhou.personal.cr.aliyuncs.com
  IMAGE_NAME: crpi-w9yhsqxiwfigz16b.cn-hangzhou.personal.cr.aliyuncs.com/jnctf_2026/challenge
  DEFAULT_TAG: web_injection_maybe_5000_fix_v1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER || '顾白ovo' }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Resolve Image Tag
        id: tag_step
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ env.DEFAULT_TAG }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "target_image=${{ env.IMAGE_NAME }}:$TAG" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./web_injection_maybe_5000
          file: ./web_injection_maybe_5000/Dockerfile
          push: true
          tags: ${{ steps.tag_step.outputs.target_image }}
